name: Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate bundle
        run: npx wrangler deploy --dry-run

      - name: Deploy
        # Secrets (TURN_KEY_ID, TURN_KEY_API_TOKEN) are set once with
        # `wrangler secret put` and are not managed from CI.
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Only needed when the token can see more than one account.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # An unset secret still arrives as an empty string, and anything that
          # is not a real account ID goes straight into the API path and comes
          # back as an opaque "Could not route to /accounts/... [code: 7003]".
          # A Cloudflare account ID is 32 hex characters; anything else is
          # dropped so wrangler can find the account from the token instead.
          if ! printf '%s' "${CLOUDFLARE_ACCOUNT_ID:-}" | grep -qE '^[0-9a-f]{32}$'; then
            if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
              echo "::warning::CLOUDFLARE_ACCOUNT_ID is not a 32-character hex account ID; ignoring it and letting the API token select the account."
            fi
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          npx wrangler deploy
