name: Android

on:
  push:
    branches:
      - main
      # Feature branches build (but never publish) so a broken commit is caught
      # before it reaches main.
      - 'claude/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret; the release APK will be debug-signed."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Kept outside the workspace so it can never be picked up by a build
          # artifact or committed by accident.
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APKs
        id: apk
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/release
          OUT=release-apks
          mkdir -p "$OUT"
          V="1.0.${GITHUB_RUN_NUMBER}"

          # Named by what a person can actually check about their phone, not by
          # the ABI string.
          cp "$SRC/app-arm64-v8a-release.apk"   "$OUT/wisp-$V-arm64.apk"
          cp "$SRC/app-armeabi-v7a-release.apk" "$OUT/wisp-$V-arm32.apk"
          cp "$SRC/app-universal-release.apk"   "$OUT/wisp-$V-universal.apk"

          ls -la "$OUT"
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wisp-apk
          path: ${{ steps.apk.outputs.dir }}
          if-no-files-found: error

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Publish release
        # Only main and manual runs cut a release, and only when the APK is
        # signed with the real key. An unsigned build falls back to the debug
        # key, and installing one of those would block every later signed
        # update until the app is uninstalled — so it never becomes a Release.
        if: >-
          steps.keystore.outputs.signed == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          DIR="${{ steps.apk.outputs.dir }}"
          V="${{ steps.apk.outputs.version }}"

          NOTES=$(cat <<EOF
          **Which file do I download?**

          | File | For |
          | --- | --- |
          | \`wisp-$V-arm64.apk\` | **Start here.** Almost every phone from the last several years. |
          | \`wisp-$V-arm32.apk\` | Older or budget phones. Try this if arm64 won't install. |
          | \`wisp-$V-universal.apk\` | Works on any phone, but a larger download. |

          They are the same app — only the built-in video engine differs, which
          is why one chip's build is roughly half the size of the combined one.

          versionCode ${GITHUB_RUN_NUMBER}, built from ${GITHUB_SHA}.
          EOF
          )

          gh release create "$TAG" \
            "$DIR/wisp-$V-arm64.apk" \
            "$DIR/wisp-$V-arm32.apk" \
            "$DIR/wisp-$V-universal.apk" \
            --title "Wisp $TAG" \
            --notes "$NOTES" \
            --latest

      - name: Explain a skipped release
        if: >-
          steps.keystore.outputs.signed != 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        run: |
          {
            echo "## No release published"
            echo
            echo "The \`KEYSTORE_BASE64\` secret is not set, so this APK was signed"
            echo "with a throwaway debug key. Installing it would block every later"
            echo "signed update until the app is uninstalled, so no Release was cut."
            echo
            echo "Run the **Generate signing key** workflow, add the four secrets it"
            echo "produces, then re-run this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
